<!DOCTYPE html>
<html>
<head>
    <title>Cerebwise</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">
        <img src="CEREBWISELOGO.png" alt="Cerebwise">

        <p>
            Understand with one search.
        </p>

        <div class="search-container">
            <input
                type="text"
                placeholder="Take your time.."
            >
            <button type="button">Search</button>
        </div>
    </main>

    <div class="mode-picker" id="mode-picker">
        <button
            class="mode-trigger"
            id="mode-trigger"
            type="button"
            aria-label="Choose a mode. Current mode: Wisdom Library"
            aria-expanded="false"
            aria-controls="mode-choices"
        >
            <img class="mode-button-image" src="ModeButton.png" alt="">
            <img
                class="current-mode-image"
                id="current-mode-image"
                src="WisdomLibraryMode.png"
                alt=""
            >
        </button>

        <div class="mode-connector" aria-hidden="true">
            <span class="mode-connector-vertical"></span>
            <span class="mode-connector-horizontal"></span>
        </div>

        <div class="mode-choices" id="mode-choices" aria-label="Choose a mode" inert>
            <button
                class="mode-choice is-selected"
                type="button"
                data-mode="Wisdom Library"
                data-image="WisdomLibraryMode.png"
                aria-pressed="true"
            >
                <img src="WisdomLibraryMode.png" alt="">
                <span>Wisdom Library</span>
            </button>
            <button
                class="mode-choice"
                type="button"
                data-mode="Simplicity"
                data-image="SimplicityMode.png"
                aria-pressed="false"
            >
                <img src="SimplicityMode.png" alt="">
                <span>Simplicity</span>
            </button>
            <button
                class="mode-choice"
                type="button"
                data-mode="Different Perspectives"
                data-image="DifferentPerspectivesMode.png"
                aria-pressed="false"
            >
                <img src="DifferentPerspectivesMode.png" alt="">
                <span>Different Perspectives</span>
            </button>
        </div>
    </div>

    <script>
        const modePicker = document.querySelector("#mode-picker");
        const modeTrigger = document.querySelector("#mode-trigger");
        const currentModeImage = document.querySelector("#current-mode-image");
        const modeChoices = document.querySelector("#mode-choices");
        const choices = document.querySelectorAll(".mode-choice");

        function setModePickerOpen(isOpen) {
            modePicker.classList.toggle("is-open", isOpen);
            modeTrigger.setAttribute("aria-expanded", String(isOpen));
            modeChoices.inert = !isOpen;
        }

        modeTrigger.addEventListener("click", () => {
            setModePickerOpen(modeTrigger.getAttribute("aria-expanded") !== "true");
        });

        choices.forEach((choice) => {
            choice.addEventListener("click", () => {
                const mode = choice.dataset.mode;
                const image = choice.dataset.image;

                currentModeImage.src = image;
                modeTrigger.setAttribute("aria-label", `Choose a mode. Current mode: ${mode}`);
                choices.forEach((item) => {
                    const isSelected = item === choice;
                    item.classList.toggle("is-selected", isSelected);
                    item.setAttribute("aria-pressed", String(isSelected));
                });
                setModePickerOpen(false);
            });
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                setModePickerOpen(false);
                modeTrigger.focus();
            }
        });

        document.addEventListener("click", (event) => {
            if (!modePicker.contains(event.target)) {
                setModePickerOpen(false);
            }
        });
    </script>
</body>
</html>
