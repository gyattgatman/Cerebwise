<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cerebwise</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">
        <img src="CEREBWISELOGO.png" alt="Cerebwise">

        <p>
            Understand with one search.
        </p>

        <form class="search-container" id="search-form">
            <label class="visually-hidden" for="SearchInp">Search question</label>
            <input id="SearchInp" class="inp" type="text"
                placeholder="Take your time.."
                aria-required="true"
                aria-describedby="search-error search-status"
                aria-invalid="false">

            <button id="Search" type="submit" aria-describedby="search-status">Search</button>

        </form>
        <p class="search-message search-error" id="search-error" role="alert" hidden></p>
        <p class="search-message" id="search-status" role="status" aria-live="polite" hidden></p>
    </main>

    <div class="mode-picker" id="mode-picker">
        <button
            class="mode-trigger"
            id="mode-trigger"
            type="button"
            aria-label="Choose a mode. Current mode: Wisdom Library"
            aria-expanded="false"
            aria-controls="mode-choices"
        >
            <img class="mode-button-image" src="ModeButton.png" alt="">
            <img
                class="current-mode-image"
                id="current-mode-image"
                src="WisdomLibraryMode.png"
                alt=""
            >
        </button>

        <div class="mode-connector" aria-hidden="true">
            <span class="mode-connector-vertical"></span>
            <span class="mode-connector-horizontal"></span>
        </div>

        <div class="mode-choices" id="mode-choices" aria-label="Choose a mode" inert>
            <button
                class="mode-choice is-selected"
                type="button"
                data-mode="Wisdom Library"
                data-image="WisdomLibraryMode.png"
                aria-pressed="true"
            >
                <img src="WisdomLibraryMode.png" alt="">
                <span>Wisdom Library</span>
            </button>
            <button
                class="mode-choice"
                type="button"
                data-mode="Simplicity"
                data-image="SimplicityMode.png"
                aria-pressed="false"
            >
                <img src="SimplicityMode.png" alt="">
                <span>Simplicity</span>
            </button>
            <button
                class="mode-choice"
                type="button"
                data-mode="Different Perspectives"
                data-image="DifferentPerspectivesMode.png"
                aria-pressed="false"
            >
                <img src="DifferentPerspectivesMode.png" alt="">
                <span>Different Perspectives</span>
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="Index.js"></script>
</body>

</html>
